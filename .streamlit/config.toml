# Aussehen und Verhalten der Chat-App (gilt, wenn die App aus dem Repository-Ordner gestartet wird)
# Streamlit läuft im hellen Theme; Dunkel und Auto (Geräteeinstellung) schaltet die App selbst um, siehe stil.py.
[theme]
base = "light"
primaryColor = "#1c1b19"
backgroundColor = "#f6f4ef"
secondaryBackgroundColor = "#ece9e1"
textColor = "#1c1b19"
baseRadius = "small"

[client]
toolbarMode = "minimal"   # kein Entwicklermenü für Besucher

[browser]
gatherUsageStats = false
